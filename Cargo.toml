[package]
name = "razertray"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
description = "Focused Windows tray utility for Razer wireless-device battery status"
repository = "https://github.com/nuxencs/razertray"

[dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
hidapi = { version = "2.6.5", features = ["windows-native"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.34.5"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tray-icon = "0.21.3"

[package.metadata.release]
push = false
tag = false

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.55.0"

[dev-dependencies]
tempfile = "3.27.0"
