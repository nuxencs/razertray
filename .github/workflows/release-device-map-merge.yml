name: release-device-map-merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'ci/device-map-sync' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Resolve existing tag
        id: tag_state
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tagged_commit=$(git rev-list -n 1 "$tag")
            merge_commit=$(git rev-parse HEAD)
            if [ "$tagged_commit" != "$merge_commit" ]; then
              echo "::error::Tag '$tag' points to $tagged_commit, expected $merge_commit."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release-on-tag.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
